<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPOP IDOL DRAFT 選秀</title>
<style>
:root {
    --primary: #ff69b4;
    --primary-dark: #d6499a;
    --accent: #ba55d3;
    --danger: #f4436b;
    --success: #3ecf6b;
    --panel: #1e1e2e;
    --panel-2: #181824;
    --line: #34344a;
}
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f0f0f, #1a0033);
    color: white;
    margin: 0; padding: 20px;
}
h1 { text-align: center; color: var(--primary); text-shadow: 0 0 15px var(--primary); }
h2 { margin-top: 0; }

.setup, .panel { background: var(--panel); padding: 20px; border-radius: 16px; max-width: 900px; margin: 0 auto 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.panel-narrow { max-width: 560px; }
.hint { color: #999; font-size: 13px; line-height: 1.6; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.field { display:flex; flex-direction: column; gap:4px; font-size: 14px; color:#cfcfe0; }
label.inline { color:#cfcfe0; font-size:14px; display:flex; align-items:center; gap:6px; }

input[type=text], input[type=number], textarea, select {
    background: #14141f; border: 1px solid var(--line); color: white;
    border-radius: 8px; padding: 9px 12px; font-size: 14px;
}
input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); }
textarea { width: 100%; font-family: monospace; }

.container { display: flex; flex-direction: column; gap: 20px; width: min(96%, 1300px); margin: 0 auto; }
#draftArea { width: 100%; }
#idolPool { width: 100%; }

#idolPool, #draftArea {
    background: var(--panel);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
}

/* 備選區：團體/成員行列式（網格）排列 */
.group-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap:8px; margin-bottom: 6px; }
.group-btn {
    background:#2a2a3a; border:1px solid var(--line); border-radius:10px; padding:7px 6px; cursor:pointer; color:#eee;
    text-align:center; transition: all .12s;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    width:100%; overflow:hidden;
}
.group-btn .gb-name { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.group-btn .gb-count { font-size:11px; color:#aaa; }
.group-btn.expanded { background: var(--primary); color:#1a0018; }
.group-btn.expanded .gb-count { color:#4a0033; }
.group-btn:hover { background:#33334a; }
.group-btn.taken { background:#242430; border-color:#444; color:#666; text-decoration: line-through; }
.group-btn.taken:hover { background:#242430; }
.group-btn.restricted { background:#3a1220; border-color: var(--danger); color:#ff8fa3; }
.group-btn.restricted:hover { background:#3a1220; }
.member-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap:8px; margin: 14px 0 16px; padding: 10px; background:#1a1a28; border-radius:10px; }
.idol-btn {
    padding: 11px 6px; border-radius: 8px; border: none;
    background: #2a2a3a; color: white; cursor: pointer; transition: all .15s;
    font-weight: 600; width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.idol-btn:hover:not(:disabled) { background: var(--primary); transform: scale(1.05); }
.idol-btn:disabled { opacity: .35; cursor: not-allowed; }
.idol-btn.taken { opacity: 1; background:#2a2a2a; border:1px solid #555; color:#777; text-decoration: line-through; }
.idol-btn.taken:hover { background:#2a2a2a; transform:none; }
.idol-btn.restricted { opacity: 1; background:#3a1220; border:1px solid var(--danger); color:#ff8fa3; }
.idol-btn.restricted:hover { background:#3a1220; transform:none; }
.idol-btn.restricted::after { content: " ❌"; }

/* 成員懸浮資料卡：左邊條列式基本資料，右邊圖片 */
.idol-hover-card {
    position: fixed; z-index: 300; display: none;
    background: #1c1c2c; border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.7);
    pointer-events: none; max-width: 280px;
}
.idol-hover-card.show { display: flex; gap: 12px; align-items: flex-start; }
.idol-hover-card .ihc-img {
    width: 84px; height: 84px; border-radius: 10px; object-fit: cover;
    background: #2a2a3a; flex-shrink: 0;
}
.idol-hover-card .ihc-noimg {
    width: 84px; height: 84px; border-radius: 10px; background: #2a2a3a;
    display: flex; align-items: center; justify-content: center;
    color: #666; font-size: 11px; text-align: center; flex-shrink: 0;
}
.idol-hover-card .ihc-list { list-style: disc; margin: 0; padding-left: 18px; }
.idol-hover-card .ihc-list li:first-child { font-weight: 800; color: var(--primary); font-size: 15px; list-style: none; margin-left: -18px; margin-bottom: 4px; }
.idol-hover-card .ihc-list li { font-size: 12px; color: #ddd; line-height: 1.7; }

/* ===== 美化按鈕 ===== */
.btn {
    border: none; border-radius: 10px; padding: 11px 22px; font-size: 15px; font-weight: 600;
    cursor: pointer; color: white; letter-spacing: .3px;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.45); filter: brightness(1.08); }
.btn:active:not(:disabled) { transform: translateY(0); filter: brightness(.95); }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; transform: none; }
.btn-primary  { background: linear-gradient(135deg, var(--primary), var(--accent)); }
.btn-secondary{ background: linear-gradient(135deg, #3a3a55, #2a2a3f); }
.btn-success  { background: linear-gradient(135deg, #43e97b, #2ea86a); }
.btn-danger   { background: linear-gradient(135deg, #ff5c7c, #d6335a); }
.btn-ghost    { background: transparent; border: 1px solid var(--line); box-shadow:none; }
.btn-ghost:hover:not(:disabled) { background: #2a2a3a; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn-lg { padding: 15px 40px; font-size: 18px; border-radius: 14px; }
.icon-btn { background:#2a2a3a; border:1px solid var(--line); color:#ddd; border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px; }
.icon-btn:hover { background:#3a3a50; }
.icon-btn:disabled { opacity:.3; cursor:not-allowed; }

/* 表格 */
table { width: 100%; border-collapse: collapse; background: var(--panel-2); border-radius: 12px; overflow: hidden; margin-top: 15px; table-layout: fixed; }
th, td { padding: 14px 8px; text-align: center; border: 1px solid #444; word-break: break-all; font-size: 14px; }
th { background: #2a2a3a; color: var(--accent); font-size: 15px; }
th.player-th { color: #fff; }
tr:nth-child(even) { background: #202030; }
tr:hover { background: #2a2a40; }
table.editor td { padding: 6px; }
table.editor input { width: 100%; padding: 6px 8px; font-size: 13px; }

.pending { background: #ff9800; color: black; font-weight: bold; padding: 12px; border-radius: 10px; margin: 12px 0; }
.finished-tag { color: var(--success); font-weight: bold; }
.badge { display:inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; background:#333; color:#ddd; margin-left:6px;}
.badge-host { background: var(--primary); color:#1a0018; }
.code-box { font-family: monospace; font-size: 20px; letter-spacing: 3px; background:#111; padding: 10px 16px; border-radius: 10px; display:inline-block; }
.link-box { display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
.link-box input { flex: 1; min-width: 220px; }

.player-chip { background:#25253a; padding:8px 14px; border-radius: 20px; margin: 4px; display:inline-flex; align-items:center; gap:8px; }

/* 限制規則公告 */
.rules-banner { background:#25253a; border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-bottom:16px; }
.rules-banner h3 { margin: 0 0 8px; color: var(--accent); font-size:16px; }
.rules-banner ul { margin: 0; padding-left: 20px; line-height: 1.8; }
.rules-banner .none { color:#999; }

/* 讓「輪到誰選擇」的文字更醒目：放大＋真正閃爍 */
.turn-highlight { color: var(--primary); font-weight: 800; font-size: 1.3em; text-shadow: 0 0 6px rgba(255,105,180,.4); animation: turnBlink 1s steps(1) infinite; }
@keyframes turnBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .55; } }

/* Draft Board：目前選擇中的格子閃爍，下一順位的格子顯示提示 */
.cell-current { background: rgba(255,105,180,.35); color:#fff; font-weight: 800; animation: cellBlink 1s steps(1) infinite; }
@keyframes cellBlink { 0%, 49% { background: rgba(255,105,180,.35); } 50%, 100% { background: rgba(186,85,211,.25); } }
.cell-next { color: var(--accent); font-style: italic; font-size: 12px; }

.modal-backdrop { position: fixed; inset:0; background: rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:50; }
.modal { background: var(--panel); border-radius: 16px; padding: 24px; max-width: 480px; width: 92%; box-shadow: 0 20px 60px rgba(0,0,0,.6); }

#connStatus { text-align:center; font-size:13px; color:#888; margin-bottom: 10px; }
#connStatus.ok { color: var(--success); }
#connStatus.err { color: var(--danger); }
</style>
</head>

// ==================== Firebase 連線設定 ====================
function loadFirebaseConfig() {
    // 優先使用內建設定，這樣任何人打開網頁都不需要手動輸入任何東西
    if (HARDCODED_FIREBASE_CONFIG && HARDCODED_FIREBASE_CONFIG.apiKey) return HARDCODED_FIREBASE_CONFIG;
    try { return JSON.parse(localStorage.getItem(LS_CONFIG) || "null"); }
    catch { return null; }
}
function initFirebase(config) {
    if (!firebase.apps.length) firebase.initializeApp(config);
    db = firebase.firestore();
}
function tryStartFirebase() {
    const cfg = loadFirebaseConfig();
    if (!cfg) { render(); return; }
    try {
        initFirebase(cfg);
        setConnStatus("ok", "✅ 已連接雲端資料庫");
        if (roomCode) listenRoom(roomCode); else render();
    } catch (e) {
        setConnStatus("err", "⚠️ Firebase 設定有誤：" + e.message);
        render();
    }
}
function setConnStatus(cls, text) {
    const el = document.getElementById("connStatus");
    el.className = cls; el.textContent = text;
}

// ==================== Firestore 房間操作 ====================
function roomRef(code) { return db.collection("kpopDraftRooms").doc(code); }

let everConnectedRoom = false;
let roomClosedByHost = false;

function listenRoom(code) {
    if (unsub) unsub();
    everConnectedRoom = false; roomClosedByHost = false; localPendingPick = null; idolSearchQuery = ""; idolSearchFocused = false; expandedGroup = null;
    setConnStatus("", "⏳ 連接房間中…");
    unsub = roomRef(code).onSnapshot(snap => {
        if (!snap.exists) {
            if (everConnectedRoom) {
                roomClosedByHost = true;
                setConnStatus("err", "⚠️ 房主已退出，房間已關閉");
            } else {
                setConnStatus("err", "⚠️ 找不到房間，房號可能錯誤或已過期");
            }
            room = null; render(); return;
        }
        everConnectedRoom = true;
        room = snap.data();
        setConnStatus("ok", `✅ 已連線房間 ${code}`);
        render();
    }, err => {
        setConnStatus("err", "⚠️ 連線錯誤：" + err.message);
    });
}

async function createRoom(hostName) {
    const code = genRoomCode();
    const data = {
        hostId: clientId,
        createdAt: Date.now(),
        status: "lobby",
        settings: {
            draftMode: "normal", minRounds: 2,
            birthRuleType: "none",     // none | scatter(隨機3~5年不連續) | rangeAround(隨機年份±1~2)
            debutRuleType: "none",     // none | scatter(隨機3年不連續) | rangeAround(隨機年份±1)
            nonKoreanRuleType: "none", // none | atLeastOne | onlyOne（房主直接指定）
            groupRuleEnabled: false,   // 限制4：隨機3~10個團體不能選
            groupCapRuleType: "none"   // 限制5：none | "1" | "2"，每個團體全場（不分玩家）最多可選人數
        },
        resolvedRules: null, // 開始選秀時才會產生的具體隨機結果，全房間共用同一份
        players: [{ id: clientId, name: hostName, team: [] }],
        idolPool: BASE_IDOLS,
        draftBoard: [],
        finishedPlayerIds: []
    };
    await roomRef(code).set(data);
    localStorage.setItem(LS_NAME, hostName);
    roomCode = code;
    const url = new URL(location.href); url.searchParams.set("room", code);
    history.replaceState(null, "", url.toString());
    listenRoom(code);
}

async function joinRoom(name) {
    localStorage.setItem(LS_NAME, name);
    await db.runTransaction(async t => {
        const ref = roomRef(roomCode);
        const snap = await t.get(ref);
        if (!snap.exists) throw new Error("房間不存在");
        const r = snap.data();
        if (r.players.some(p => p.id === clientId)) return; // 已在房內（重新整理）
        if (r.status !== "lobby") throw new Error("遊戲已開始，無法加入");
        const players = r.players.concat([{ id: clientId, name, team: [] }]);
        t.update(ref, { players });
    });
}

async function updateSettings(patch) {
    await roomRef(roomCode).update({ settings: { ...room.settings, ...patch } });
}

async function saveIdolPool(pool) {
    await roomRef(roomCode).update({ idolPool: pool });
}

async function shufflePlayers() {
    const arr = room.players.slice();
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    await roomRef(roomCode).update({ players: arr });
}

async function movePlayerOrder(playerId, direction) {
    const idx = room.players.findIndex(p => p.id === playerId);
    if (idx === -1) return;
    const newIdx = idx + direction;
    if (newIdx < 0 || newIdx >= room.players.length) return;
    const arr = room.players.slice();
    [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
    await roomRef(roomCode).update({ players: arr });
}

async function removePlayer(id) {
    await roomRef(roomCode).update({ players: room.players.filter(p => p.id !== id) });
}

function computeActiveOrder(players, finishedIds, roundNumber, draftMode) {
    let active = players.map(p => p.id).filter(id => !finishedIds.includes(id));
    if (draftMode === "snake" && roundNumber % 2 === 1) active.reverse();
    return active;
}
function ensureCurrentRound(draftBoard, players, finishedIds, draftMode) {
    let last = draftBoard[draftBoard.length - 1];
    if (last && Object.keys(last.picks).length < last.order.length) return { draftBoard, done: false };
    let roundNumber = draftBoard.length;
    let order = computeActiveOrder(players, finishedIds, roundNumber, draftMode);
    if (order.length === 0) return { draftBoard, done: true };
    return { draftBoard: draftBoard.concat([{ order, picks: {} }]), done: false };
}
// 支援「同時以多個團體活動」的偶像：group 欄位可寫成「A團/B團」，用這個函式拆出個別團名
function idolGroups(idol) {
    return String(idol.group || "").split("/").map(s => s.trim()).filter(Boolean);
}

// 年份輸入驗證：只接受 1900~今年+1 之間的合理西元年份，避免 500、1300 這種明顯錯誤的值進入資料庫
// 取得資料庫目前該欄位（出生年或出道年）實際存在的最早～最近年份，作為驗證新輸入值的上下限
// 年份輸入驗證：只攔截明顯不合理的數字（例如 500、1300 這種打錯字），範圍是寬鬆的 1900~今年+1。
// 不會限制新輸入的年份要落在「資料庫目前既有」的範圍內，這樣才能讓資料庫自然成長——
// 之後新增比現有資料更早或更晚的偶像，會直接被接受，不需要手動調整任何東西；
// 選秀限制1、2的年份範圍本來就是在開始選秀當下即時重新抓資料庫最新狀態，會自動跟著長大。
function sanitizeYearInput(value) {
    const v = String(value || "").trim();
    if (v === "") return "";
    if (!/^\d{1,4}$/.test(v)) return "";
    const n = parseInt(v, 10);
    const maxY = new Date().getFullYear() + 1;
    if (n < 1900 || n > maxY) return "";
    return String(n);
}

function getCurrentPlayerId(draftBoard) {
    let last = draftBoard[draftBoard.length - 1];
    if (!last) return null;
    let pos = Object.keys(last.picks).length;
    return last.order[pos] ?? null;
}
function getTurnPosition(draftBoard) {
    let last = draftBoard[draftBoard.length - 1];
    if (!last) return null;
    return { round: draftBoard.length, position: Object.keys(last.picks).length + 1 };
}
function applyPickToBoard(draftBoard, playerId, value) {
    let copy = draftBoard.map(r => ({ order: r.order, picks: { ...r.picks } }));
    copy[copy.length - 1].picks[playerId] = value;
    return copy;
}

function isRevealActive() {
    return !!(room && room.lastReveal && room.lastReveal.until && Date.now() < room.lastReveal.until);
}

function sampleRandom(arr, k) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[copy[i], copy[j]] = [copy[j], copy[i]]; }
    return copy.slice(0, Math.max(0, k));
}

function resolveRules(settings, idolPool) {
    const maxReasonableYear = new Date().getFullYear() + 1;
    const isReasonableYear = y => !isNaN(y) && y >= 1900 && y <= maxReasonableYear;
    const birthYears = idolPool.map(i => parseInt(i.birthYear)).filter(isReasonableYear);
    const debutYears = idolPool.map(i => parseInt(i.debutYear)).filter(isReasonableYear);
    const groups = Array.from(new Set(idolPool.flatMap(i => idolGroups(i))));

    let bannedBirthYears = [];
    if (birthYears.length) {
        // 只從資料庫實際出現過的出生年裡抽，避免抽到沒人出生的空白年份
        const distinctYears = Array.from(new Set(birthYears)).sort((a, b) => a - b);
        if (settings.birthRuleType === "scatter") {
            const count = Math.min(distinctYears.length, 3 + Math.floor(Math.random() * 3)); // 3~5
            bannedBirthYears = sampleRandom(distinctYears, count);
        } else if (settings.birthRuleType === "rangeAround") {
            const base = distinctYears[Math.floor(Math.random() * distinctYears.length)];
            const lowOffset = 1 + Math.floor(Math.random() * 2);  // 1~2
            const highOffset = 1 + Math.floor(Math.random() * 2); // 1~2
            for (let y = base - lowOffset; y <= base + highOffset; y++) bannedBirthYears.push(y);
        }
    }

    let bannedDebutYears = [];
    if (debutYears.length) {
        // 只從資料庫實際出現過的出道年裡抽，避免抽到沒人出道的空白年份
        const distinctYears = Array.from(new Set(debutYears)).sort((a, b) => a - b);
        if (settings.debutRuleType === "scatter") {
            const count = Math.min(distinctYears.length, 3); // 隨機3年
            bannedDebutYears = sampleRandom(distinctYears, count);
        } else if (settings.debutRuleType === "rangeAround") {
            const base = distinctYears[Math.floor(Math.random() * distinctYears.length)];
            for (let y = base - 1; y <= base + 1; y++) bannedDebutYears.push(y); // 固定 ±1
        }
    }

    let bannedGroups = [];
    if (settings.groupRuleEnabled && groups.length) {
        const count = Math.min(groups.length, 3 + Math.floor(Math.random() * 8)); // 3~10
        bannedGroups = sampleRandom(groups, count);
    }

    return {
        bannedBirthYears: bannedBirthYears.sort((a, b) => a - b),
        bannedDebutYears: bannedDebutYears.sort((a, b) => a - b),
        bannedGroups
    };
}

async function startGame() {
    let { draftBoard, done } = ensureCurrentRound([], room.players, [], room.settings.draftMode);
    if (done) { alert("沒有玩家可以開始遊戲"); return; }
    const resolvedRules = resolveRules(room.settings, room.idolPool);
    await roomRef(roomCode).update({ status: "playing", draftBoard, finishedPlayerIds: [], resolvedRules });
}

function pickIdol(idol) {
    if (getCurrentPlayerId(room.draftBoard) !== clientId) return;
    if (isRevealActive()) return;
    if (localPendingPick) return;
    if (isIdolTaken(idol)) return;
    if (isRestrictedByRules(idol)) return;
    if (isBlockedForPlayer(idol, clientId)) return;
    if (isGroupCapReached(idol, clientId)) return;
    localPendingPick = idol;
    render();
}

async function confirmPick() {
    if (!localPendingPick) return;
    if (isRevealActive()) return;
    const idol = localPendingPick;
    localPendingPick = null;
    await db.runTransaction(async t => {
        const ref = roomRef(roomCode);
        const snap = await t.get(ref);
        const r = snap.data();
        if (getCurrentPlayerId(r.draftBoard) !== clientId) return;
        if (r.lastReveal && r.lastReveal.until && Date.now() < r.lastReveal.until) return;
        if (r.players.some(p => p.team.some(x => x.name === idol.name && x.group === idol.group))) return;
        if (r.settings.groupCapRuleType && r.settings.groupCapRuleType !== "none") {
            const cap = parseInt(r.settings.groupCapRuleType);
            const me0 = r.players.find(p => p.id === clientId);
            const counts = groupPickCounts(me0 ? me0.team : []);
            const myGroups = idolGroups(idol);
            if (myGroups.some(g => (counts[g] || 0) >= cap)) return;
        }
        const me = r.players.find(p => p.id === clientId);
        let players = r.players.map(p => p.id === clientId ? { ...p, team: p.team.concat([idol]) } : p);
        let draftBoard = applyPickToBoard(r.draftBoard, clientId, `${idol.name} (${idol.group})`);
        let ensured = ensureCurrentRound(draftBoard, players, r.finishedPlayerIds, r.settings.draftMode);
        let status = ensured.done ? "finished" : "playing";
        let lastReveal = {
            playerName: me ? me.name : "",
            idolName: idol.name,
            idolGroup: idol.group,
            until: Date.now() + 3000
        };
        t.update(ref, { players, draftBoard: ensured.draftBoard, status, lastReveal });
    });
    render();
}

function cancelPick() {
    localPendingPick = null;
    render();
}

async function finishTurn() {
    if (isRevealActive()) return;
    await db.runTransaction(async t => {
        const ref = roomRef(roomCode);
        const snap = await t.get(ref);
        const r = snap.data();
        if (getCurrentPlayerId(r.draftBoard) !== clientId) return;
        if (r.lastReveal && r.lastReveal.until && Date.now() < r.lastReveal.until) return;
        const me = r.players.find(p => p.id === clientId);
        if (me.team.length < r.settings.minRounds) return;
        if (!nonKoreanRequirementSatisfied(me, r)) return;
        let finishedPlayerIds = r.finishedPlayerIds.concat([clientId]);
        let draftBoard = applyPickToBoard(r.draftBoard, clientId, "FINISHED");
        let ensured = ensureCurrentRound(draftBoard, r.players, finishedPlayerIds, r.settings.draftMode);
        let status = ensured.done ? "finished" : "playing";
        t.update(ref, { finishedPlayerIds, draftBoard: ensured.draftBoard, status });
    });
}

// ==================== 限制規則 ====================
function isPureKorean(idol) {
    const n = (idol.nationality || "").trim();
    // 空白視為未填寫資料，暫時當作「純韓籍」以避免規則失效（房主應盡量補上國籍資料）
    return n === "" || n === "韓國" || n === "韓國籍" || n === "Korea" || n === "Korean" || n === "한국";
}

// 全域限制：限制1(出生年) ＋ 限制2(出道年) ＋ 限制4(隨機團體)
// 具體結果在開始選秀時就已經隨機決定好（存在 room.resolvedRules），全場玩家共用同一份結果
function isRestrictedByRules(idol) {
    const rr = room.resolvedRules || { bannedBirthYears: [], bannedDebutYears: [], bannedGroups: [] };
    const by = parseInt(idol.birthYear);
    if (!isNaN(by) && rr.bannedBirthYears.includes(by)) return true;
    const dy = parseInt(idol.debutYear);
    if (!isNaN(dy) && rr.bannedDebutYears.includes(dy)) return true;
    const myGroups = idolGroups(idol);
    if (myGroups.some(g => rr.bannedGroups.includes(g))) return true;

    return false;
}

function isIdolTaken(idol) {
    return room.players.some(p => p.team.some(t => t.name === idol.name && t.group === idol.group));
}

// 限制5：每位玩家「各自」對每個團體最多可選 1 或 2 位（不是全場加總）；雙團體成員被選走時，所屬的每個團體都各自算一次
function groupPickCounts(team) {
    const counts = {};
    (team || []).forEach(picked => {
        idolGroups(picked).forEach(g => { counts[g] = (counts[g] || 0) + 1; });
    });
    return counts;
}
function isGroupCapReached(idol, playerId) {
    const s = room.settings;
    if (!s.groupCapRuleType || s.groupCapRuleType === "none") return false;
    const cap = parseInt(s.groupCapRuleType);
    const player = room.players.find(p => p.id === playerId);
    if (!player) return false;
    const counts = groupPickCounts(player.team);
    const myGroups = idolGroups(idol);
    return myGroups.some(g => (counts[g] || 0) >= cap);
}

// 限制3・「只能一位非純韓籍」模式：這位玩家一旦選過1位非純韓籍成員，之後其餘非純韓籍成員這場都不能再選（只影響他自己）
function isBlockedForPlayer(idol, playerId) {
    if (room.settings.nonKoreanRuleType !== "onlyOne") return false;
    if (isPureKorean(idol)) return false;
    const player = room.players.find(p => p.id === playerId);
    if (!player) return false;
    return player.team.some(i => !isPureKorean(i));
}

// 限制3・「至少一位非純韓籍」模式：結束指名前必須至少選過1位非純韓籍；除非選秀池已無非純韓籍成員可選了（含被其他限制排除的也算不能選）
function nonKoreanRequirementSatisfied(player, r) {
    r = r || room;
    if (r.settings.nonKoreanRuleType !== "atLeastOne") return true;
    if (player.team.some(i => !isPureKorean(i))) return true;
    const takenKeys = new Set();
    r.players.forEach(p => p.team.forEach(t => takenKeys.add(t.name + "|" + t.group)));
    const rr = r.resolvedRules || { bannedBirthYears: [], bannedDebutYears: [], bannedGroups: [] };
    const myGroupCounts = groupPickCounts(player.team);
    const cap = r.settings.groupCapRuleType && r.settings.groupCapRuleType !== "none" ? parseInt(r.settings.groupCapRuleType) : null;
    const remainingNonKorean = r.idolPool.some(i => {
        if (isPureKorean(i)) return false;
        if (takenKeys.has(i.name + "|" + i.group)) return false;
        const by = parseInt(i.birthYear); if (!isNaN(by) && rr.bannedBirthYears.includes(by)) return false;
        const dy = parseInt(i.debutYear); if (!isNaN(dy) && rr.bannedDebutYears.includes(dy)) return false;
        const myGroups = idolGroups(i);
        if (myGroups.some(g => rr.bannedGroups.includes(g))) return false;
        if (cap !== null && myGroups.some(g => (myGroupCounts[g] || 0) >= cap)) return false;
        return true;
    });
    return !remainingNonKorean; // 池裡已無非純韓籍可選 → 視為滿足（豁免）
}

function render() {
    const app = document.getElementById("app");
    if (!db) { app.innerHTML = renderFirebaseSetup(); bindFirebaseSetup(); return; }
    if (!roomCode) { app.innerHTML = renderHome(); bindHome(); return; }
    if (!room) {
        if (roomClosedByHost) {
            app.innerHTML = `<div class="panel panel-narrow">
                <h2>🚪 房間已關閉</h2>
                <p class="hint">房主已退出，這場遊戲已經結束。</p>
                <div class="row"><button class="btn btn-primary" id="backHomeBtn">回首頁</button></div>
            </div>`;
            document.getElementById("backHomeBtn").onclick = goHome;
        } else {
            app.innerHTML = `<div class="panel panel-narrow">連線中…若長時間無反應，請確認房號或 Firebase 設定是否正確。</div>`;
        }
        return;
    }

    const isHost = room.hostId === clientId;
    const me = room.players.find(p => p.id === clientId);
    if (!me) { app.innerHTML = renderJoin(); bindJoin(); return; }

    if (room.status === "lobby") { app.innerHTML = renderLobby(isHost); bindLobby(isHost); return; }
    app.innerHTML = renderGame(isHost);
    bindGame(isHost);
    scheduleRevealRerender();
}

let revealTimerId = null;
function scheduleRevealRerender() {
    if (!room || !room.lastReveal || !room.lastReveal.until) return;
    const msLeft = room.lastReveal.until - Date.now();
    if (msLeft <= 0) return;
    if (revealTimerId) clearTimeout(revealTimerId);
    revealTimerId = setTimeout(() => { revealTimerId = null; render(); }, msLeft + 50);
}

function renderFirebaseSetup() {

        左側選單「Build → Firestore Database」→ 建立資料庫（測試模式即可）→
        回到「專案總覽」旁的齒輪「專案設定」→ 拉到最下方「你的應用程式」→ 新增網頁應用程式 →
        複製出現的 <code>firebaseConfig</code> 物件，貼在下面即可。<br><br>
        這組設定只會存在你自己的瀏覽器（localStorage），房間內的其他玩家也要各自貼上「同一組」設定才能加入同一個房間。
        </p>
        <textarea id="fbConfigInput" rows="8" placeholder='貼上像這樣的內容：
{
  apiKey: "AIza...",
  authDomain: "xxx.firebaseapp.com",
  projectId: "xxx",
  storageBucket: "xxx.appspot.com",
  messagingSenderId: "...",
  appId: "..."
}'></textarea>
        <div class="row">
            <button class="btn btn-primary" id="fbSaveBtn">儲存並連線</button>
        </div>
    </div>`;
}
function extractConfigObject(raw) {
    // 允許使用者貼上「整段 const firebaseConfig = {...};」或「只貼花括號內容」
    // 做法：只取第一個 { 到最後一個 } 之間的內容，去掉前後多餘的宣告語法
    const start = raw.indexOf("{");
    const end = raw.lastIndexOf("}");
    if (start === -1 || end === -1 || end < start) {
        throw new Error("找不到 { } 物件內容，請確認有複製到完整的 firebaseConfig。");
    }
    const objText = raw.slice(start, end + 1);
    return new Function("return (" + objText + ")")();
}

function bindFirebaseSetup() {
    document.getElementById("fbSaveBtn").onclick = async () => {
        const raw = document.getElementById("fbConfigInput").value.trim();
        if (!raw) return;
        const btn = document.getElementById("fbSaveBtn");
        let cfg;
        try {
            cfg = extractConfigObject(raw);
        } catch (e) {
            alert("設定格式看起來不太對，請確認是否完整複製了 firebaseConfig 物件。\n" + e.message);
            return;
        }
        if (!cfg.apiKey || !cfg.projectId) {
            alert("缺少 apiKey 或 projectId，請確認複製了完整的設定內容。");
            return;
        }
        btn.disabled = true; btn.textContent = "連線測試中…";
        try {
            initFirebase(cfg);
            // 實際嘗試連線一次，確認 Firestore 有啟用、規則允許讀取
            await db.collection("kpopDraftRooms").limit(1).get();
            localStorage.setItem(LS_CONFIG, JSON.stringify(cfg));
            setConnStatus("ok", "✅ 已連接雲端資料庫");
            if (roomCode) listenRoom(roomCode); else render();
        } catch (e) {
            btn.disabled = false; btn.textContent = "儲存並連線";
            let reason = e.message || String(e);
            let hint = "";
            if (e.code === "permission-denied" || /Missing or insufficient permissions/i.test(reason)) {
                hint = "→ 資料庫的「安全性規則」目前不允許讀寫，請到 Firestore →「規則」分頁，確認是用測試模式（test mode）建立，或規則允許 read/write。";
            } else if (/not.*found|NOT_FOUND/i.test(reason)) {
                hint = "→ 這個專案似乎還沒有建立 Firestore 資料庫，請到 Firebase Console → Firestore → 建立資料庫。";
            } else if (/api key|API key/i.test(reason)) {
                hint = "→ apiKey 看起來不正確，請重新複製一次 firebaseConfig。";
            } else {
                hint = "→ 請確認：1) 已建立 Firestore 資料庫 2) 網路正常 3) 專案設定值正確。";
            }
            alert("連線失敗：" + reason + "\n" + hint);
        }
    };
}

function renderLobbyRulesPreview() {

    if (s.birthRuleType === "scatter") items.push("限制1：出生年隨機3~5年不能選");

    else if (s.nonKoreanRuleType === "onlyOne") items.push("限制3：每人最多選1位非純韓籍");

    if (s.groupRuleEnabled) items.push("限制4：隨機3~10個團體不能選（含SOLO）");

    if (s.groupCapRuleType === "1") items.push("限制5：每人每個團體最多選1位");
    else if (s.groupCapRuleType === "2") items.push("限制5：每人每個團體最多選2位");

    return `<div class="panel">
        <div class="rules-banner" style="margin:0;">
            <h3>📢 本場限制規則</h3>
            ${items.length ? `<ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>` : `<div class="none">本場沒有開啟任何限制</div>`}
            <p class="hint" style="margin-top:8px;">出生年／出道年／團體的具體隨機結果，會在按下「開始選秀」的當下才決定，屆時會在選秀畫面公告給所有人。</p>
        </div>
    </div>`;
}

function bindLobby(isHost) {
    document.getElementById("leaveBtn")?.addEventListener("click", leaveRoom);
    document.getElementById("copyLinkBtn").onclick = () => {
        navigator.clipboard?.writeText(inviteUrl()).then(() => alert("已複製邀請連結！")).catch(() => prompt("複製這個連結：", inviteUrl()));
    };
    document.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => removePlayer(b.dataset.remove));
    document.querySelectorAll("[data-moveup]").forEach(b => b.onclick = () => movePlayerOrder(b.dataset.moveup, -1));
    document.querySelectorAll("[data-movedown]").forEach(b => b.onclick = () => movePlayerOrder(b.dataset.movedown, 1));
    if (!isHost) return;

    document.getElementById("shuffleBtn").onclick = shufflePlayers;
    document.getElementById("draftModeSel").onchange = e => updateSettings({ draftMode: e.target.value });
    document.getElementById("minRoundsInput").onchange = e => updateSettings({ minRounds: Math.max(1, parseInt(e.target.value) || 1) });

    document.getElementById("birthEnabledChk")?.addEventListener("change", e => {
        document.getElementById("birthModeBox").style.display = e.target.checked ? "" : "none";
    });
    document.getElementById("debutEnabledChk")?.addEventListener("change", e => {
        document.getElementById("debutModeBox").style.display = e.target.checked ? "" : "none";
    });
    document.getElementById("nonKoreanEnabledChk")?.addEventListener("change", e => {
        document.getElementById("nonKoreanModeBox").style.display = e.target.checked ? "" : "none";
    });
    document.getElementById("groupCapEnabledChk")?.addEventListener("change", e => {
        document.getElementById("groupCapModeBox").style.display = e.target.checked ? "" : "none";
    });

    document.getElementById("saveWheelRulesBtn")?.addEventListener("click", () => {
        const birthEnabled = document.getElementById("birthEnabledChk").checked;
        const debutEnabled = document.getElementById("debutEnabledChk").checked;
        const nonKoreanEnabled = document.getElementById("nonKoreanEnabledChk").checked;
        const groupCapEnabled = document.getElementById("groupCapEnabledChk").checked;
        updateSettings({
            birthRuleType: birthEnabled ? document.getElementById("birthRuleTypeSel").value : "none",
            debutRuleType: debutEnabled ? document.getElementById("debutRuleTypeSel").value : "none",
            nonKoreanRuleType: nonKoreanEnabled ? document.getElementById("nonKoreanRuleTypeSel").value : "none",
            groupRuleEnabled: document.getElementById("groupRuleEnabledChk").checked,
            groupCapRuleType: groupCapEnabled ? document.getElementById("groupCapRuleTypeSel").value : "none"
        });
    });

    document.getElementById("saveIdolTableBtn").onclick = () => {
        const pool = room.idolPool.map(i => ({ ...i }));
        let invalidCount = 0;
        document.querySelectorAll("table.editor input[data-idx]").forEach(inp => {
            const field = inp.dataset.field;
            let value = inp.value;
            if (field === "birthYear" || field === "debutYear") {
                const clean = sanitizeYearInput(value);
                if (value.trim() !== "" && clean === "") invalidCount++;
                value = clean;
            }
            pool[parseInt(inp.dataset.idx)][field] = value;
        });
        if (invalidCount > 0) alert(`偵測到 ${invalidCount} 筆年份格式不正確（例如非數字或明顯不合理，如500、1300），已自動清空，請重新確認填寫正確的西元年份。`);
        saveIdolPool(pool);
    };
    document.querySelectorAll("[data-delidol]").forEach(b => b.onclick = () => {
        const idx = parseInt(b.dataset.delidol);
        const pool = room.idolPool.filter((_, i) => i !== idx);
        saveIdolPool(pool);
    });
    document.getElementById("addIdolBtn").onclick = () => {
        const name = document.getElementById("newIdolName").value.trim();
        const group = document.getElementById("newIdolGroup").value.trim();
        if (!name || !group) { alert("請輸入姓名與團體"); return; }
        const birthRaw = document.getElementById("newIdolBirth").value;
        const debutRaw = document.getElementById("newIdolDebut").value;
        const birthYear = sanitizeYearInput(birthRaw);
        const debutYear = sanitizeYearInput(debutRaw);
        if ((birthRaw.trim() !== "" && birthYear === "") || (debutRaw.trim() !== "" && debutYear === "")) {
            alert("出生年或出道年格式不正確（例如非數字或明顯不合理，如500、1300），已自動清空該欄位。");
        }
        const nationality = document.getElementById("newIdolNationality").value.trim();
        const imageUrl = document.getElementById("newIdolImage").value.trim();
        saveIdolPool(room.idolPool.concat([{ name, group, birthYear, debutYear, nationality, imageUrl }]));
    };
    document.getElementById("csvImportBtn").onclick = () => {
        const text = document.getElementById("csvImport").value.trim();
        if (!text) return;
        let pool = room.idolPool.map(i => ({ ...i }));
        let invalidCount = 0;
        text.split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
            const [name, group, birthRaw = "", debutRaw = "", nationality = "", imageUrl = ""] = line.split(",").map(s => s.trim());
            if (!name || !group) return;
            const birthYear = sanitizeYearInput(birthRaw);
            const debutYear = sanitizeYearInput(debutRaw);
            if ((birthRaw !== "" && birthYear === "") || (debutRaw !== "" && debutYear === "")) invalidCount++;
            const existing = pool.find(i => i.name === name && i.group === group);
            if (existing) { existing.birthYear = birthYear; existing.debutYear = debutYear; existing.nationality = nationality; existing.imageUrl = imageUrl; }
            else pool.push({ name, group, birthYear, debutYear, nationality, imageUrl });
        });
        if (invalidCount > 0) alert(`偵測到 ${invalidCount} 筆年份格式不正確（例如非數字或明顯不合理，如500、1300），已自動清空。`);
        saveIdolPool(pool);
    };
    document.getElementById("startGameBtn").onclick = startGame;
}

function renderRulesBanner() {
    const s = room.settings;
    const rr = room.resolvedRules || { bannedBirthYears: [], bannedDebutYears: [], bannedGroups: [] };
    const items = [];

    if (s.birthRuleType !== "none") {
        if (rr.bannedBirthYears.length) items.push(`🚫 出生年 <b>${rr.bannedBirthYears.join("、")}</b> 不能選`);
        else items.push(`🚫 出生年限制已開啟，但資料庫無資料`);
    }
    if (s.debutRuleType !== "none") {
        if (rr.bannedDebutYears.length) items.push(`🚫 出道年 <b>${rr.bannedDebutYears.join("、")}</b> 不能選`);
        else items.push(`🚫 出道年限制已開啟，但資料庫無資料`);
    }
    if (s.groupRuleEnabled) {
        if (rr.bannedGroups.length) {
            const hasSolo = rr.bannedGroups.includes("SOLO");
            items.push(`🚫 團體 <b>${rr.bannedGroups.join("、")}</b> 不能選${hasSolo ? "（含SOLO）" : ""}`);
        } else {
            items.push(`🚫 團體限制已開啟，但資料庫無資料`);
        }
    }
    if (s.nonKoreanRuleType === "atLeastOne") items.push(`🌏 每人至少選 <b>1 位非純韓籍</b>才能結束指名`);
    else if (s.nonKoreanRuleType === "onlyOne") items.push(`🌏 每人<b>最多選 1 位</b>非純韓籍`);

    if (s.groupCapRuleType === "1") items.push(`👥 每人每個團體最多選 <b>1 位</b>`);
    else if (s.groupCapRuleType === "2") items.push(`👥 每人每個團體最多選 <b>2 位</b>`);

    return `<div class="rules-banner">
        <h3>📢 本場選秀限制</h3>
        ${items.length ? `<ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>` : `<div class="none">本場沒有開啟任何限制</div>`}
    </div>`;
}

function idolHoverAttrs(idol) {

}

// 依文字長度估算合適字級，避免長名字超出按鈕範圍；短文字維持最大字級，長文字按比例縮小到最小字級為止
function fitTextFontSize(text, maxSize, minSize, charsAtMax) {
    const len = String(text || "").length;
    if (len <= charsAtMax) return maxSize;
    const size = Math.round(maxSize * (charsAtMax / len));
    return Math.max(minSize, Math.min(maxSize, size));
}

function renderIdolPoolHtml() {
    let html = "<h2 style=\"font-size:18px;\">🎤 偶像選秀池</h2>";
    html += `<div class="row" style="margin-bottom:8px;">
        <input type="text" id="idolSearchInput" placeholder="搜尋 名字(團名)" value="${idolSearchQuery.replace(/"/g, "&quot;")}" style="flex:1; min-width:180px; font-size:13px; padding:7px 10px;">
    </div>`;
    const myTurn = getCurrentPlayerId(room.draftBoard) === clientId && room.status === "playing" && !localPendingPick && !isRevealActive();
    const query = idolSearchQuery.trim().toLowerCase();
    const filteredPool = query
        ? room.idolPool.filter(i => `${i.name}(${i.group})`.toLowerCase().includes(query))
        : room.idolPool;
    let groups = {};
    filteredPool.forEach(i => { idolGroups(i).forEach(g => { (groups[g] ||= []).push(i); }); });
    const naturalCompare = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
    const groupKeys = Object.keys(groups).sort(naturalCompare);
    if (groupKeys.length === 0) {
        html += `<div class="hint">沒有符合搜尋條件的偶像</div>`;
        return html;
    }
    const forceExpand = query !== "";

    html += `<div class="group-grid">`;
    groupKeys.forEach(g => {
        const isExpanded = forceExpand || expandedGroup === g;
        const members = groups[g];
        const allTaken = members.every(idol => isIdolTaken(idol));
        const allRestricted = !allTaken && members.every(idol =>
            isRestrictedByRules(idol) || isBlockedForPlayer(idol, clientId) || isGroupCapReached(idol, clientId)
        );
        const stateCls = allTaken ? "taken" : (allRestricted ? "restricted" : "");
        const groupFontSize = fitTextFontSize(g, 15, 9, 8);
        html += `<button class="group-btn ${isExpanded ? "expanded" : ""} ${stateCls}" data-togglegroup="${g}">
            <span class="gb-name" style="font-size:${groupFontSize}px;">${g}</span>
            <span class="gb-count">(${members.length})</span>
        </button>`;
    });
    html += `</div>`;

    groupKeys.forEach(g => {
        const isExpanded = forceExpand || expandedGroup === g;
        if (!isExpanded) return;
        const members = groups[g];
        html += `<div class="member-grid">`;
        members.forEach(idol => {
            const taken = isIdolTaken(idol);
            const restricted = !taken && (isRestrictedByRules(idol) || isBlockedForPlayer(idol, clientId) || isGroupCapReached(idol, clientId));
            const disabled = taken || restricted || !myTurn;
            const cls = taken ? "taken" : (restricted ? "restricted" : "");
            const memberFontSize = fitTextFontSize(idol.name, 13, 9, 8);
            html += `<button class="idol-btn ${cls}" style="font-size:${memberFontSize}px;" ${idolHoverAttrs(idol)} data-pick="${idol.name}|${idol.group}" ${disabled ? "disabled" : ""}>${idol.name}</button>`;
        });
        html += `</div>`;
    });
    return html;
}

function renderDraftAreaHtml() {
    let html = "<h2>👥 選秀進行中</h2>";
    const curId = getCurrentPlayerId(room.draftBoard);
    const cur = room.players.find(p => p.id === curId);
    const pos = getTurnPosition(room.draftBoard);
    const reveal = isRevealActive();
    const myTurn = curId === clientId && !reveal;
    html += `<div style="background:#25253a; padding:18px; border-radius:12px; margin-bottom:15px;">`;
    if (room.status === "finished") {
        html += `<h3><span class="turn-highlight">🎉 所有玩家已結束指名！</span></h3>`;
    } else if (reveal) {
        const rv = room.lastReveal;
        html += `<h3><span class="turn-highlight">🎉 ${rv.playerName} 選擇了 ${rv.idolName} (${rv.idolGroup})！</span></h3>`;
        html += `<div style="color:#aaa;">即將進行下一位…</div>`;
    } else {
        const roundLabel = pos ? `${pos.round}-${pos.position}輪 ` : "";
        html += `<h3>本輪選擇：<span class="turn-highlight">${roundLabel}${cur ? cur.name : "—"} 選擇中...</span>${curId === clientId ? "（你）" : ""}</h3>`;
        if (localPendingPick && myTurn) {
            html += `<div class="pending">已選擇：${localPendingPick.name} (${localPendingPick.group})<br><br>
            <button class="btn btn-success btn-sm" id="confirmPickBtn">✅ 確定放入表格</button>
            <button class="btn btn-danger btn-sm" id="cancelPickBtn">❌ 取消</button></div>`;
        } else if (myTurn) {
            html += `<div style="font-size:1.05em;">點擊下方偶像進行選擇</div>`;
        }
    }
    html += `</div>`;
    if (room.status === "playing" && myTurn && !localPendingPick) {
        const me = room.players.find(p => p.id === clientId);
        const hasEnoughPicks = me.team.length >= room.settings.minRounds;
        const nonKoreanOk = nonKoreanRequirementSatisfied(me);
        const canFinish = hasEnoughPicks && nonKoreanOk;
        let label = "✅ 結束我的指名";
        if (!hasEnoughPicks) label = `還需選 ${room.settings.minRounds - me.team.length} 人`;
        else if (!nonKoreanOk) label = "還需選 1 位非純韓籍成員才能結束";
        html += `<button class="btn btn-secondary" id="finishTurnBtn" ${canFinish ? "" : "disabled"}>${label}</button>`;
    }
    html += renderDraftBoardHtml();
    html += renderPlayerExportButtons();
    return html;
}

function renderPlayerExportButtons() {
    let html = `<div style="margin-top:14px;"><h4 style="margin:0 0 8px; color:#ccc; font-size:14px;">📤 個人選秀結果匯出</h4><div class="row">`;
    room.players.forEach(p => {
        const has = p.team.length > 0;
        html += `<button class="btn btn-ghost btn-sm" data-exportplayer="${p.id}" ${has ? "" : "disabled"} title="${has ? "" : "尚未選任何人"}">📤 匯出 ${p.name} 的結果</button>`;
    });
    html += `</div></div>`;
    return html;
}

function findIdolByLabel(label) {
    // label 格式："name (group)"
    const m = /^(.*) \((.*)\)$/.exec(label);
    if (!m) return null;
    return room.idolPool.find(i => i.name === m[1] && i.group === m[2]) || null;
}

function renderDraftBoardHtml() {
    const pos = getTurnPosition(room.draftBoard);
    const curId = getCurrentPlayerId(room.draftBoard);
    const reveal = isRevealActive();
    const lastRoundIdx = room.draftBoard.length - 1;
    const isActive = room.status === "playing" && !reveal;
    let nextPlayerId = null;
    let previewNextOrder = null; // 若目前選擇者是本輪最後一位，預先算出下一輪的順序，讓「下一順位」可以顯示在新的一列
    if (pos && lastRoundIdx >= 0 && isActive) {
        const lastRound = room.draftBoard[lastRoundIdx];
        if (pos.position < lastRound.order.length) {
            nextPlayerId = lastRound.order[pos.position] || null; // pos.position 是1-indexed，剛好是陣列中下一位的0-indexed位置
        } else {
            // 目前選擇者是本輪最後一位，預先計算下一輪的順序（尚未真正寫入資料庫）
            const nextOrder = computeActiveOrder(room.players, room.finishedPlayerIds, room.draftBoard.length, room.settings.draftMode);
            if (nextOrder.length > 0) {
                previewNextOrder = nextOrder;
                nextPlayerId = nextOrder[0];
            }
        }
    }

    const playerCount = room.players.length;
    const colWidthPx = Math.max(70, Math.min(150, Math.floor(760 / Math.max(playerCount, 1))));
    const fontPx = playerCount <= 4 ? 15 : playerCount <= 7 ? 13 : playerCount <= 10 ? 12 : 11;
    const tableMaxWidth = Math.min(1000, 90 + (playerCount + 1) * colWidthPx);

    let html = `<h3>📋 Draft Board（輪次 × 玩家）</h3>
    <div style="overflow-x:auto;">
    <table style="width:auto; max-width:${tableMaxWidth}px; min-width:100%; font-size:${fontPx}px;">
    <tr><th style="width:60px;">輪次</th>`;
    room.players.forEach(p => html += `<th class="player-th" style="width:${colWidthPx}px;">${p.name}</th>`);
    html += `</tr>`;
    room.draftBoard.forEach((round, roundIdx) => {
        html += `<tr><td><b>${roundIdx + 1}</b></td>`;
        room.players.forEach(p => {
            const val = round.picks[p.id];
            const isCurrentCell = isActive && roundIdx === lastRoundIdx && p.id === curId;
            const isNextCell = isActive && roundIdx === lastRoundIdx && p.id === nextPlayerId && !val && !isCurrentCell;
            if (val === "FINISHED") html += `<td class="finished-tag">已結束指名</td>`;
            else if (val) {
                const idol = findIdolByLabel(val);
                html += idol ? `<td title="${idolTooltip(idol)}">${val}</td>` : `<td>${val}</td>`;
            }
            else if (isCurrentCell) html += `<td class="cell-current">選擇中</td>`;
            else if (isNextCell) html += `<td class="cell-next">下一順位</td>`;
            else if (round.order.includes(p.id)) html += `<td>-</td>`;
            else html += `<td></td>`;
        });
        html += `</tr>`;
    });
    if (previewNextOrder) {
        html += `<tr><td><b>${room.draftBoard.length + 1}</b></td>`;
        room.players.forEach(p => {
            if (p.id === previewNextOrder[0]) html += `<td class="cell-next">下一順位</td>`;
            else if (previewNextOrder.includes(p.id)) html += `<td>-</td>`;
            else html += `<td></td>`;
        });
        html += `</tr>`;
    }
    html += `</table></div>`;
    return html;
}

function bindGame(isHost) {
    document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
        const [name, group] = b.dataset.pick.split("|");
        const idol = room.idolPool.find(i => i.name === name && i.group === group);
        if (idol) pickIdol(idol);
    });
    document.querySelectorAll("[data-togglegroup]").forEach(b => b.onclick = () => {
        const g = b.dataset.togglegroup;
        if (expandedGroup === g) expandedGroup = null; else expandedGroup = g;
        render();
    });
    document.getElementById("confirmPickBtn")?.addEventListener("click", confirmPick);
    document.getElementById("cancelPickBtn")?.addEventListener("click", cancelPick);
    document.getElementById("finishTurnBtn")?.addEventListener("click", finishTurn);
    document.getElementById("leaveBtn")?.addEventListener("click", leaveRoom);
    document.getElementById("downloadResultsBtn")?.addEventListener("click", e => downloadDraftResults(e.currentTarget));
    document.querySelectorAll("[data-exportplayer]").forEach(b => b.addEventListener("click", e => {
        const player = room.players.find(p => p.id === b.dataset.exportplayer);
        exportPlayerResultImage(player, e.currentTarget);
    }));

    const searchInput = document.getElementById("idolSearchInput");
    if (searchInput) {
        searchInput.addEventListener("input", e => { idolSearchQuery = e.target.value; render(); });
        searchInput.addEventListener("focus", () => { idolSearchFocused = true; });
        searchInput.addEventListener("blur", () => { idolSearchFocused = false; });
        if (idolSearchFocused) {
            searchInput.focus();
            const len = searchInput.value.length;
            searchInput.setSelectionRange(len, len);
        }
    }
}

// ==================== 匯出選秀結果（圖片） ====================

// 載入圖片，設定 crossOrigin 讓圖片來源允許時可以正常匯出成 canvas 圖片
function loadImageEl(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("圖片載入失敗：" + src));
        img.src = src;
    });
}

// 以「填滿裁切（cover）」的方式把圖片畫進指定的矩形範圍
function drawImageCover(ctx, img, x, y, w, h) {
    const scale = Math.max(w / img.width, h / img.height);
    const sw = w / scale, sh = h / scale;
    const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

// 沒有圖片、或圖片載入失敗時的預留位置方塊
function drawPlaceholderBox(ctx, x, y, w, h) {
    ctx.fillStyle = "#2a2a3a";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#444";
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = "#666";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("尚無圖片", x + w / 2, y + h / 2);
}

// 嘗試載入某位偶像的圖片；失敗或沒有網址時回傳 null（呼叫端改畫預留位置）
async function tryLoadIdolImage(idol) {
    if (!idol || !idol.imageUrl) return null;
    try { return await loadImageEl(idol.imageUrl); }
    catch (e) { return null; }
}

// 排列順序：第1輪放最中間，之後偶數輪往右擴、奇數輪往左擴（例如5輪時左到右是 5,3,1,2,4）
function pickOffsetFromCenter(round) {
    if (round === 1) return 0;
    if (round % 2 === 0) return round / 2;
    return -((round - 1) / 2);
}

function triggerCanvasDownload(canvas, filename) {
    canvas.toBlob(blob => {
        if (!blob) { alert("圖片產生失敗，可能是圖片來源不允許匯出（跨網域限制）。"); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }, "image/png");
}

// 個人選秀結果：把該玩家選到的成員圖片排成一張橫圖，順序依照「第1輪置中、往外展開」排列
async function exportPlayerResultImage(player, btn) {
    if (!player || !player.team.length) { alert(`${player ? player.name : ""} 目前還沒有選任何人`); return; }
    if (btn) { btn.disabled = true; btn.textContent = "產生中..."; }
    try {
        const cellW = 200, imgH = 200, labelH = 56, headerH = 60, pad = 16;
        const n = player.team.length;
        const canvas = document.createElement("canvas");
        canvas.width = n * cellW + pad * 2;
        canvas.height = headerH + imgH + labelH + pad;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#12121c";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff69b4";
        ctx.font = "bold 26px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.fillText(`${player.name} 的選秀結果`, canvas.width / 2, 40);

        const ordered = player.team
            .map((idol, idx) => ({ idol, round: idx + 1, offset: pickOffsetFromCenter(idx + 1) }))
            .sort((a, b) => a.offset - b.offset);

        for (let i = 0; i < ordered.length; i++) {
            const { idol, round } = ordered[i];
            const x = pad + i * cellW;
            const y = headerH;
            const imgEl = await tryLoadIdolImage(idol);
            if (imgEl) drawImageCover(ctx, imgEl, x + 10, y, cellW - 20, imgH);
            else drawPlaceholderBox(ctx, x + 10, y, cellW - 20, imgH);

            ctx.fillStyle = "#ffd700";
            ctx.font = "bold 12px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(`第${round}輪`, x + 14, y + 18);

            ctx.fillStyle = "#fff";
            ctx.font = "bold 15px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(idol.name, x + cellW / 2, y + imgH + 24);
            ctx.fillStyle = "#aaa";
            ctx.font = "12px sans-serif";
            ctx.fillText(`(${idol.group})`, x + cellW / 2, y + imgH + 44);
        }

        triggerCanvasDownload(canvas, `${player.name}_選秀結果.png`);
    } catch (e) {
        alert("匯出失敗：" + e.message);
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = "📤 匯出我的結果"; }
    }
}

// 全體選秀結果：整個 Draft Board 版面（輪次 × 玩家）繪成一張圖片，取代原本的文字檔匯出
async function downloadDraftResults(btn) {
    if (room.status !== "finished") return;
    if (btn) { btn.disabled = true; btn.textContent = "產生中..."; }
    try {
        const players = room.players;
        const rounds = room.draftBoard;
        const cellW = 140, cellH = 150, thumb = 84, roundColW = 64, headerH = 70, rowHeaderH = 34, pad = 16;
        const canvas = document.createElement("canvas");
        canvas.width = roundColW + players.length * cellW + pad * 2;
        canvas.height = headerH + rowHeaderH + rounds.length * cellH + pad;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#12121c";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff69b4";
        ctx.font = "bold 24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`選秀結果`, canvas.width / 2, 34);
        ctx.fillStyle = "#999";
        ctx.font = "12px sans-serif";
        ctx.fillText(new Date().toLocaleString(), canvas.width / 2, 54);

        const headerY = headerH + rowHeaderH;
        ctx.fillStyle = "#ba55d3";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText("輪次", pad + roundColW / 2, headerY - 10);
        players.forEach((p, ci) => {
            const x = pad + roundColW + ci * cellW + cellW / 2;
            ctx.fillStyle = "#fff";
            ctx.fillText(p.name, x, headerY - 10);
        });

        for (let ri = 0; ri < rounds.length; ri++) {
            const round = rounds[ri];
            const rowY = headerY + ri * cellH;
            ctx.fillStyle = "#ccc";
            ctx.font = "bold 16px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(String(ri + 1), pad + roundColW / 2, rowY + cellH / 2);

            for (let ci = 0; ci < players.length; ci++) {
                const p = players[ci];
                const val = round.picks[p.id];
                const x = pad + roundColW + ci * cellW;
                if (val === "FINISHED") {
                    ctx.fillStyle = "#3ecf6b";
                    ctx.font = "13px sans-serif";
                    ctx.fillText("已結束指名", x + cellW / 2, rowY + cellH / 2);
                } else if (val) {
                    const idol = findIdolByLabel(val);
                    const imgX = x + (cellW - thumb) / 2;
                    const imgY = rowY + 8;
                    const imgEl = idol ? await tryLoadIdolImage(idol) : null;
                    if (imgEl) drawImageCover(ctx, imgEl, imgX, imgY, thumb, thumb);
                    else drawPlaceholderBox(ctx, imgX, imgY, thumb, thumb);
                    ctx.fillStyle = "#fff";
                    ctx.font = "12px sans-serif";
                    ctx.fillText(idol ? idol.name : val, x + cellW / 2, imgY + thumb + 18);
                }
            }
        }

        triggerCanvasDownload(canvas, `選秀結果_${roomCode}.png`);
    } catch (e) {
        alert("匯出失敗：" + e.message);
    } finally {
        if (btn) { btn.disabled = room.status !== "finished"; btn.textContent = "📥 下載選秀結果"; }
    }
}

// ==================== 退出房間 ====================
function goHome() {
    if (unsub) { unsub(); unsub = null; }
    room = null; roomCode = null; localPendingPick = null; idolSearchQuery = ""; idolSearchFocused = false; expandedGroup = null;
    const url = new URL(location.href); url.searchParams.delete("room");
    history.replaceState(null, "", url.toString());
    render();
}

async function leaveRoom() {
    const amHost = room.hostId === clientId;

    if (amHost && room.status !== "lobby") {
        // 選秀中房主退出：不是真的離開房間，而是把整場重置回準備房間，
        // 所有人（包含房主自己）都留在房間裡、一起回到大廳，剛才的選秀進度會被清空
        const msg = "退出選秀後，房間會重置回準備房間，所有人（包含你）都會回到大廳重新設定，剛才的選秀進度會被清空。確定要退出嗎？";
        if (!confirm(msg)) return;
        await db.runTransaction(async t => {
            const ref = roomRef(roomCode);
            const snap = await t.get(ref);
            if (!snap.exists) return;
            const r = snap.data();
            const resetPlayers = r.players.map(p => ({ ...p, team: [] }));
            t.update(ref, {
                players: resetPlayers,
                status: "lobby",
                draftBoard: [],
                finishedPlayerIds: [],
                resolvedRules: null,
                lastReveal: null
            });
        });
        // 不呼叫 goHome()：房主仍留在這個房間裡，畫面會透過即時同步自然轉回大廳畫面
        return;
    }

    const msg = amHost
        ? "確定要退出嗎？退出後房主身分會轉移給下一位玩家，房間仍會保留，之後可以用同一個邀請連結或房號重新加入。"
        : "確定要退出這場遊戲嗎？退出後你會離開房間，其他玩家不受影響會繼續遊戲。";
    if (!confirm(msg)) return;

    await db.runTransaction(async t => {
        const ref = roomRef(roomCode);
        const snap = await t.get(ref);
        if (!snap.exists) return;
        const r = snap.data();

        const players = r.players.filter(p => p.id !== clientId);
        if (players.length === 0) {
            t.delete(ref);
            return;
        }
        const hostId = amHost ? players[0].id : r.hostId;
        const finishedPlayerIds = r.finishedPlayerIds.filter(id => id !== clientId);

        let draftBoard = r.draftBoard.map(rnd => {
            const order = rnd.order.filter(id => id !== clientId);
            const picks = { ...rnd.picks };
            delete picks[clientId];
            return { order, picks };
        }).filter(rnd => rnd.order.length > 0);

        let status = r.status;
        if (r.status === "playing") {
            const ensured = ensureCurrentRound(draftBoard, players, finishedPlayerIds, r.settings.draftMode);
            draftBoard = ensured.draftBoard;
            status = ensured.done ? "finished" : "playing";
        }

        t.update(ref, { hostId, players, finishedPlayerIds, draftBoard, status });
    });
    goHome();
}

// ==================== 成員懸浮資料卡（事件代理，只綁定一次，不受 render() 重繪影響） ====================
(function setupIdolHoverCard() {
    const card = document.getElementById("idolHoverCard");
    if (!card) return;

    function renderCardContent(el) {
        const name = el.dataset.hoverName || "";
        const group = el.dataset.hoverGroup || "";
        const birth = el.dataset.hoverBirth || "未知";
        const debut = el.dataset.hoverDebut || "未知";
        const nat = el.dataset.hoverNat || "未知";
        const img = el.dataset.hoverImg || "";
        const imgHtml = img
            ? `<img class="ihc-img" src="${img}" alt="${name}" onerror="this.outerHTML='<div class=&quot;ihc-noimg&quot;>尚無圖片</div>'">`
            : `<div class="ihc-noimg">尚無圖片</div>`;
        card.innerHTML = `<ul class="ihc-list">
            <li>${name}</li>
            <li>所屬團體：${group}</li>
            <li>國籍：${nat}</li>
            <li>出生年：${birth}</li>
            <li>出道年：${debut}</li>
        </ul>${imgHtml}`;
    }

    function positionCard(x, y) {
        const margin = 16;
        const cardW = 300, cardH = 110; // 概略估計，避免溢出畫面邊界
        let left = x + margin;
        let top = y + margin;
        if (left + cardW > window.innerWidth) left = x - cardW - margin;
        if (top + cardH > window.innerHeight) top = y - cardH - margin;
        card.style.left = Math.max(4, left) + "px";
        card.style.top = Math.max(4, top) + "px";
    }

    document.addEventListener("mouseover", e => {
        const el = e.target.closest('[data-idol-hover="1"]');
        if (!el) return;
        renderCardContent(el);
        card.classList.add("show");
        positionCard(e.clientX, e.clientY);
    });
    document.addEventListener("mousemove", e => {
        if (card.classList.contains("show")) positionCard(e.clientX, e.clientY);
    });
    document.addEventListener("mouseout", e => {
        const el = e.target.closest('[data-idol-hover="1"]');
        if (el) card.classList.remove("show");
    });
    // 手機等無滑鼠裝置：點擊時短暫顯示，避免卡片卡住不消失
    document.addEventListener("touchstart", e => {
        const el = e.target.closest('[data-idol-hover="1"]');
        if (!el) { card.classList.remove("show"); return; }
        renderCardContent(el);
        card.classList.add("show");
        const touch = e.touches[0];
        if (touch) positionCard(touch.clientX, touch.clientY);
        clearTimeout(card._hideTimer);
        card._hideTimer = setTimeout(() => card.classList.remove("show"), 2500);
    }, { passive: true });
})();
