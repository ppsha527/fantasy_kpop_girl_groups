<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPOP IDOL DRAFT 選秀</title>
<style>
:root {
    --primary: #ff69b4;
    --primary-dark: #d6499a;
    --accent: #ba55d3;
    --danger: #f4436b;
    --success: #3ecf6b;
    --panel: #1e1e2e;
    --panel-2: #181824;
    --line: #34344a;
}
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f0f0f, #1a0033);
    color: white;
    margin: 0; padding: 20px;
}
h1 { text-align: center; color: var(--primary); text-shadow: 0 0 15px var(--primary); }
h2 { margin-top: 0; }

.setup, .panel { background: var(--panel); padding: 20px; border-radius: 16px; max-width: 900px; margin: 0 auto 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.panel-narrow { max-width: 560px; }
.hint { color: #999; font-size: 13px; line-height: 1.6; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.field { display:flex; flex-direction: column; gap:4px; font-size: 14px; color:#cfcfe0; }
label.inline { color:#cfcfe0; font-size:14px; display:flex; align-items:center; gap:6px; }

input[type=text], input[type=number], textarea, select {
    background: #14141f; border: 1px solid var(--line); color: white;
    border-radius: 8px; padding: 9px 12px; font-size: 14px;
}
input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); }
textarea { width: 100%; font-family: monospace; }

.container { display: flex; gap: 25px; max-width: 1600px; margin: 0 auto; }
#idolPool { width: 48%; }
#draftArea { width: 52%; }

#idolPool, #draftArea {
    background: var(--panel);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
}

.group-section { margin-bottom: 28px; }
.group-title { font-size: 22px; margin: 12px 0; color: #ffd700; padding-bottom: 8px; border-bottom: 2px solid #333; display:flex; justify-content: space-between; align-items:center;}
.idol-btn {
    margin: 6px 4px; padding: 10px 16px; border-radius: 50px; border: none;
    background: #2a2a3a; color: white; cursor: pointer; transition: all .15s;
    font-size: 14px;
}
.idol-btn:hover:not(:disabled) { background: var(--primary); transform: scale(1.08); }
.idol-btn:disabled { opacity: .35; cursor: not-allowed; }

/* ===== 美化按鈕 ===== */
.btn {
    border: none; border-radius: 10px; padding: 11px 22px; font-size: 15px; font-weight: 600;
    cursor: pointer; color: white; letter-spacing: .3px;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.45); filter: brightness(1.08); }
.btn:active:not(:disabled) { transform: translateY(0); filter: brightness(.95); }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; transform: none; }
.btn-primary  { background: linear-gradient(135deg, var(--primary), var(--accent)); }
.btn-secondary{ background: linear-gradient(135deg, #3a3a55, #2a2a3f); }
.btn-success  { background: linear-gradient(135deg, #43e97b, #2ea86a); }
.btn-danger   { background: linear-gradient(135deg, #ff5c7c, #d6335a); }
.btn-ghost    { background: transparent; border: 1px solid var(--line); box-shadow:none; }
.btn-ghost:hover:not(:disabled) { background: #2a2a3a; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn-lg { padding: 15px 40px; font-size: 18px; border-radius: 14px; }
.icon-btn { background:#2a2a3a; border:1px solid var(--line); color:#ddd; border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px; }
.icon-btn:hover { background:#3a3a50; }

/* 表格 */
table { width: 100%; border-collapse: collapse; background: var(--panel-2); border-radius: 12px; overflow: hidden; margin-top: 15px; table-layout: fixed; }
th, td { padding: 14px 8px; text-align: center; border: 1px solid #444; word-break: break-all; font-size: 14px; }
th { background: #2a2a3a; color: var(--accent); font-size: 15px; }
tr:nth-child(even) { background: #202030; }
tr:hover { background: #2a2a40; }
table.editor td { padding: 6px; }
table.editor input { width: 100%; padding: 6px 8px; font-size: 13px; }

.pending { background: #ff9800; color: black; font-weight: bold; padding: 12px; border-radius: 10px; margin: 12px 0; }
.finished-tag { color: var(--success); font-weight: bold; }
.badge { display:inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; background:#333; color:#ddd; margin-left:6px;}
.badge-host { background: var(--primary); color:#1a0018; }
.code-box { font-family: monospace; font-size: 20px; letter-spacing: 3px; background:#111; padding: 10px 16px; border-radius: 10px; display:inline-block; }
.link-box { display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
.link-box input { flex: 1; min-width: 220px; }

.player-chip { background:#25253a; padding:8px 14px; border-radius: 20px; margin: 4px; display:inline-flex; align-items:center; gap:8px; }

/* 轉盤 */
.wheel-wrap { display:flex; flex-direction: column; align-items:center; gap: 16px; padding: 10px 0 4px; }
#wheelCanvas { border-radius: 50%; box-shadow: 0 0 30px rgba(255,105,180,.5); background:#111; }
.wheel-pointer { font-size: 30px; margin-bottom: -14px; }
.wheel-result { font-size: 22px; font-weight: bold; color: #ffd700; min-height: 32px; }

.modal-backdrop { position: fixed; inset:0; background: rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:50; }
.modal { background: var(--panel); border-radius: 16px; padding: 24px; max-width: 480px; width: 92%; box-shadow: 0 20px 60px rgba(0,0,0,.6); }

#connStatus { text-align:center; font-size:13px; color:#888; margin-bottom: 10px; }
#connStatus.ok { color: var(--success); }
#connStatus.err { color: var(--danger); }
</style>

// ==================== Firebase 連線設定 ====================
function loadFirebaseConfig() {
    try { return JSON.parse(localStorage.getItem(LS_CONFIG) || "null"); }
    catch { return null; }
}
function initFirebase(config) {
    if (!firebase.apps.length) firebase.initializeApp(config);
    db = firebase.firestore();
}
function tryStartFirebase() {
    const cfg = loadFirebaseConfig();
    if (!cfg) { render(); return; }
    try {
        initFirebase(cfg);
        setConnStatus("ok", "✅ 已連接雲端資料庫");
        if (roomCode) listenRoom(roomCode); else render();
    } catch (e) {
        setConnStatus("err", "⚠️ Firebase 設定有誤：" + e.message);
        render();
    }
}
function setConnStatus(cls, text) {
    const el = document.getElementById("connStatus");
    el.className = cls; el.textContent = text;
}

// ==================== Firestore 房間操作 ====================
function roomRef(code) { return db.collection("kpopDraftRooms").doc(code); }

let everConnectedRoom = false;
let roomClosedByHost = false;

function listenRoom(code) {
    if (unsub) unsub();
    everConnectedRoom = false; roomClosedByHost = false;
    setConnStatus("", "⏳ 連接房間中…");
    unsub = roomRef(code).onSnapshot(snap => {
        if (!snap.exists) {
            if (everConnectedRoom) {
                roomClosedByHost = true;
                setConnStatus("err", "⚠️ 房主已退出，房間已關閉");
            } else {
                setConnStatus("err", "⚠️ 找不到房間，房號可能錯誤或已過期");
            }
            room = null; render(); return;
        }
        everConnectedRoom = true;
        room = snap.data();
        setConnStatus("ok", `✅ 已連線房間 ${code}`);
        render();
    }, err => {
        setConnStatus("err", "⚠️ 連線錯誤：" + err.message);
    });
}

async function createRoom(hostName) {
    const code = genRoomCode();
    const data = {
        hostId: clientId,
        createdAt: Date.now(),
        status: "lobby",
        settings: { draftMode: "normal", minRounds: 2, wheelEnabled: false, wheelExcludedGroups: [], wheelExcludedNames: "" },
        players: [{ id: clientId, name: hostName, team: [] }],
        idolPool: BASE_IDOLS,
        draftBoard: [],
        finishedPlayerIds: [],
        pendingPick: null
    };
    await roomRef(code).set(data);
    localStorage.setItem(LS_NAME, hostName);
    roomCode = code;
    const url = new URL(location.href); url.searchParams.set("room", code);
    history.replaceState(null, "", url.toString());
    listenRoom(code);
}

async function joinRoom(name) {
    localStorage.setItem(LS_NAME, name);
    await db.runTransaction(async t => {
        const ref = roomRef(roomCode);
        const snap = await t.get(ref);
        if (!snap.exists) throw new Error("房間不存在");
        const r = snap.data();
        if (r.players.some(p => p.id === clientId)) return; // 已在房內（重新整理）
        if (r.status !== "lobby") throw new Error("遊戲已開始，無法加入");
        const players = r.players.concat([{ id: clientId, name, team: [] }]);
        t.update(ref, { players });
    });
}

async function updateSettings(patch) {
    await roomRef(roomCode).update({ settings: { ...room.settings, ...patch } });
}

async function saveIdolPool(pool) {
    await roomRef(roomCode).update({ idolPool: pool });
}

async function shufflePlayers() {
    const arr = room.players.slice();
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    await roomRef(roomCode).update({ players: arr });
}

async function removePlayer(id) {
    await roomRef(roomCode).update({ players: room.players.filter(p => p.id !== id) });
}

// ---- 純邏輯（回合順序 / 蛇形選秀），已於本地測試驗證 ----
function computeActiveOrder(players, finishedIds, roundNumber, draftMode) {
    let active = players.map(p => p.id).filter(id => !finishedIds.includes(id));
    if (draftMode === "snake" && roundNumber % 2 === 1) active.reverse();
    return active;
}
function ensureCurrentRound(draftBoard, players, finishedIds, draftMode) {
    let last = draftBoard[draftBoard.length - 1];
    if (last && Object.keys(last.picks).length < last.order.length) return { draftBoard, done: false };
    let roundNumber = draftBoard.length;
    let order = computeActiveOrder(players, finishedIds, roundNumber, draftMode);
    if (order.length === 0) return { draftBoard, done: true };
    return { draftBoard: draftBoard.concat([{ order, picks: {} }]), done: false };
}
function getCurrentPlayerId(draftBoard) {
    let last = draftBoard[draftBoard.length - 1];
    if (!last) return null;
    let pos = Object.keys(last.picks).length;
    return last.order[pos] ?? null;
}
function applyPickToBoard(draftBoard, playerId, value) {
    let copy = draftBoard.map(r => ({ order: r.order, picks: { ...r.picks } }));
    copy[copy.length - 1].picks[playerId] = value;
    return copy;
}

async function startGame() {
    let { draftBoard, done } = ensureCurrentRound([], room.players, [], room.settings.draftMode);
    if (done) { alert("沒有玩家可以開始遊戲"); return; }
    await roomRef(roomCode).update({ status: "playing", draftBoard, finishedPlayerIds: [] });
}

async function pickIdol(idol) {
    if (getCurrentPlayerId(room.draftBoard) !== clientId) return;
    if (room.pendingPick) return;
    await roomRef(roomCode).update({ pendingPick: { idol } });
}

async function confirmPick() {
    await db.runTransaction(async t => {
        const ref = roomRef(roomCode);
        const snap = await t.get(ref);
        const r = snap.data();
        if (getCurrentPlayerId(r.draftBoard) !== clientId || !r.pendingPick) return;
        const idol = r.pendingPick.idol;
        let players = r.players.map(p => p.id === clientId ? { ...p, team: p.team.concat([idol]) } : p);
        let idolPool = r.idolPool.filter(i => !(i.name === idol.name && i.group === idol.group));
        let draftBoard = applyPickToBoard(r.draftBoard, clientId, `${idol.name} (${idol.group})`);
        let ensured = ensureCurrentRound(draftBoard, players, r.finishedPlayerIds, r.settings.draftMode);
        let status = ensured.done ? "finished" : "playing";
        t.update(ref, { players, idolPool, draftBoard: ensured.draftBoard, pendingPick: null, status });
    });
}

async function cancelPick() {
    if (getCurrentPlayerId(room.draftBoard) !== clientId) return;
    await roomRef(roomCode).update({ pendingPick: null });
}

async function finishTurn() {
    await db.runTransaction(async t => {
        const ref = roomRef(roomCode);
        const snap = await t.get(ref);
        const r = snap.data();
        if (getCurrentPlayerId(r.draftBoard) !== clientId) return;
        const me = r.players.find(p => p.id === clientId);
        if (me.team.length < r.settings.minRounds) return;
        let finishedPlayerIds = r.finishedPlayerIds.concat([clientId]);
        let draftBoard = applyPickToBoard(r.draftBoard, clientId, "FINISHED");
        let ensured = ensureCurrentRound(draftBoard, r.players, finishedPlayerIds, r.settings.draftMode);
        let status = ensured.done ? "finished" : "playing";
        t.update(ref, { finishedPlayerIds, draftBoard: ensured.draftBoard, status });
    });
}

// ==================== 轉盤 ====================
function eligibleForWheel() {
    const ex = room.settings.wheelExcludedGroups || [];
    const names = (room.settings.wheelExcludedNames || "").split(",").map(s => s.trim()).filter(Boolean);
    return room.idolPool.filter(i => !ex.includes(i.group) && !names.includes(i.name));
}

function spinWheel() {
    if (wheelAnimating) return;
    const pool = eligibleForWheel();
    if (pool.length === 0) { alert("轉盤中沒有可選擇的偶像（可能都被房主排除了）"); return; }
    wheelAnimating = true;
    const resultEl = document.getElementById("wheelResult");
    let ticks = 0; const maxTicks = 22 + Math.floor(Math.random() * 10);
    const timer = setInterval(() => {
        ticks++;
        const pick = pool[Math.floor(Math.random() * pool.length)];
        if (resultEl) resultEl.textContent = `${pick.name} (${pick.group})`;
        if (ticks >= maxTicks) {
            clearInterval(timer);
            wheelAnimating = false;
            const finalPick = pool[Math.floor(Math.random() * pool.length)];
            if (resultEl) resultEl.textContent = `🎉 ${finalPick.name} (${finalPick.group})`;
            pickIdol(finalPick);
        }
    }, 90);
}

        複製出現的 <code>firebaseConfig</code> 物件，貼在下面即可。<br><br>
        這組設定只會存在你自己的瀏覽器（localStorage），房間內的其他玩家也要各自貼上「同一組」設定才能加入同一個房間。

        <div class="row">
            <button class="btn btn-primary" id="fbSaveBtn">儲存並連線</button>
        </div>
    </div>`;
}
function extractConfigObject(raw) {
    // 允許使用者貼上「整段 const firebaseConfig = {...};」或「只貼花括號內容」
    // 做法：只取第一個 { 到最後一個 } 之間的內容，去掉前後多餘的宣告語法
    const start = raw.indexOf("{");
    const end = raw.lastIndexOf("}");
    if (start === -1 || end === -1 || end < start) {
        throw new Error("找不到 { } 物件內容，請確認有複製到完整的 firebaseConfig。");
    }
    const objText = raw.slice(start, end + 1);
    return new Function("return (" + objText + ")")();
}

function bindFirebaseSetup() {
    document.getElementById("fbSaveBtn").onclick = async () => {
        const raw = document.getElementById("fbConfigInput").value.trim();
        if (!raw) return;
        const btn = document.getElementById("fbSaveBtn");
        let cfg;
        try {
            cfg = extractConfigObject(raw);
        } catch (e) {
            alert("設定格式看起來不太對，請確認是否完整複製了 firebaseConfig 物件。\n" + e.message);
            return;
        }
        if (!cfg.apiKey || !cfg.projectId) {
            alert("缺少 apiKey 或 projectId，請確認複製了完整的設定內容。");
            return;
        }
        btn.disabled = true; btn.textContent = "連線測試中…";
        try {
            initFirebase(cfg);
            // 實際嘗試連線一次，確認 Firestore 有啟用、規則允許讀取
            await db.collection("kpopDraftRooms").limit(1).get();
            localStorage.setItem(LS_CONFIG, JSON.stringify(cfg));
            setConnStatus("ok", "✅ 已連接雲端資料庫");
            if (roomCode) listenRoom(roomCode); else render();
        } catch (e) {
            btn.disabled = false; btn.textContent = "儲存並連線";
            let reason = e.message || String(e);
            let hint = "";
            if (e.code === "permission-denied" || /Missing or insufficient permissions/i.test(reason)) {
                hint = "→ 資料庫的「安全性規則」目前不允許讀寫，請到 Firestore →「規則」分頁，確認是用測試模式（test mode）建立，或規則允許 read/write。";
            } else if (/not.*found|NOT_FOUND/i.test(reason)) {
                hint = "→ 這個專案似乎還沒有建立 Firestore 資料庫，請到 Firebase Console → Firestore → 建立資料庫。";
            } else if (/api key|API key/i.test(reason)) {
                hint = "→ apiKey 看起來不正確，請重新複製一次 firebaseConfig。";
            } else {
                hint = "→ 請確認：1) 已建立 Firestore 資料庫 2) 網路正常 3) 專案設定值正確。";
            }
            alert("連線失敗：" + reason + "\n" + hint);
        }
    };
}

function bindGame(isHost) {
    document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
        const [name, group] = b.dataset.pick.split("|");
        const idol = room.idolPool.find(i => i.name === name && i.group === group);
        if (idol) pickIdol(idol);
    });
    document.getElementById("spinBtn")?.addEventListener("click", spinWheel);
    document.getElementById("confirmPickBtn")?.addEventListener("click", confirmPick);
    document.getElementById("cancelPickBtn")?.addEventListener("click", cancelPick);
    document.getElementById("finishTurnBtn")?.addEventListener("click", finishTurn);
    document.getElementById("leaveBtn")?.addEventListener("click", leaveRoom);
}

// ==================== 退出房間 ====================
function goHome() {
    if (unsub) { unsub(); unsub = null; }
    room = null; roomCode = null;
    const url = new URL(location.href); url.searchParams.delete("room");
    history.replaceState(null, "", url.toString());
    render();
}

async function leaveRoom() {
    const amHost = room.hostId === clientId;
    const msg = amHost
        ? "你是房主，退出後這個房間會直接關閉，所有玩家都會被移出遊戲。確定要退出嗎？"
        : "確定要退出這場遊戲嗎？退出後你會離開房間，其他玩家不受影響會繼續遊戲。";
    if (!confirm(msg)) return;

    if (amHost) {
        await roomRef(roomCode).delete();
        goHome();
        return;
    }

    await db.runTransaction(async t => {
        const ref = roomRef(roomCode);
        const snap = await t.get(ref);
        if (!snap.exists) return;
        const r = snap.data();
        const curIdBefore = getCurrentPlayerId(r.draftBoard);

        const players = r.players.filter(p => p.id !== clientId);
        const finishedPlayerIds = r.finishedPlayerIds.filter(id => id !== clientId);

        let draftBoard = r.draftBoard.map(rnd => {
            const order = rnd.order.filter(id => id !== clientId);
            const picks = { ...rnd.picks };
            delete picks[clientId];
            return { order, picks };
        }).filter(rnd => rnd.order.length > 0);

        let status = r.status;
        if (r.status === "playing") {
            const ensured = ensureCurrentRound(draftBoard, players, finishedPlayerIds, r.settings.draftMode);
            draftBoard = ensured.draftBoard;
            status = ensured.done ? "finished" : "playing";
        }

        const pendingPick = curIdBefore === clientId ? null : r.pendingPick;

        t.update(ref, { players, finishedPlayerIds, draftBoard, status, pendingPick });
    });
    goHome();
}

// ==================== 啟動 ====================
tryStartFirebase();
